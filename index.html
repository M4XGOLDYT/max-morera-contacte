
<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10131a">
<title>Max Morera Santamaria | Contacte</title>


<style>
* {
  box-sizing: border-box;
}

html {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  margin: 0;
  width: 100%;
  height: 100%;
  height: 100dvh;
  padding: 12px;
  overflow: hidden;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #17191C;
  color: #F2F2F0;
  font-family: system-ui, sans-serif;
}

.card {
  width: 100%;
  max-width: 390px;
  max-height: 100%;
  overflow: auto;
  overscroll-behavior: contain;

  padding: clamp(14px, 4vh, 32px) 24px;

  border: 1px solid #3B3E43;
  border-radius: 24px;

  background: #22252A;
  text-align: center;
}

.avatar {
  width: clamp(52px, 10vh, 84px);
  height: clamp(52px, 10vh, 84px);
  margin: auto;

  display: grid;
  place-items: center;

  border-radius: 50%;
  background: #DC956B;
  color: #24201D;

  font-size: 27px;
  font-weight: 750;
  flex-shrink: 0;
}

h1 {
  font-size: clamp(20px, 5vw, 25px);
  margin: 14px 0 6px;
  overflow-wrap: anywhere;
  color: #F2F2F0;
}

p {
  color: #B9BBC0;
  line-height: 1.4;
  margin: 8px 0;
}

a,
button {
  width: 100%;
  display: block;
  margin-top: 10px;
  padding: 12px;

  border: 1px solid #454950;
  border-radius: 12px;

  color: #F2F2F0;
  background: #2D3035;

  text-decoration: none;
  font: inherit;
  font-weight: 600;
  cursor: pointer;

  -webkit-tap-highlight-color: transparent;
  transition: background-color 0.2s ease;
}

.primary {
  background: #DC956B;
  color: #24201D;
  border-color: #DC956B;
}

a:hover,
button:hover {
  background: #393D43;
}

.primary:hover {
  background: #E5A780;
  border-color: #E5A780;
}

a:focus-visible,
button:focus-visible {
  outline: 2px solid #DC956B;
  outline-offset: 3px;
}

.note {
  font-size: 12px;
  margin-top: 16px;
  color: #B9BBC0;
}

@media (max-height: 600px) {
  body {
    padding: 8px;
  }

  .card {
    padding-top: 10px;
    padding-bottom: 10px;
  }

  h1 {
    margin-top: 8px;
  }

  a,
  button {
    margin-top: 6px;
    padding: 9px;
  }

  .note {
    margin-top: 8px;
  }
}

@media (prefers-reduced-motion: reduce) {
  a,
  button {
    transition: none;
  }
}
</style>


</head>
<body>
<main class="card">
  <div class="avatar">MM</div>
  <h1>Max Morera Santamaria</h1>

  <button class="primary" onclick="saveContact()">
    Desa el contacte ⬇️📁
  </button>

  <a href="tel:+34641064192">Truca'm</a>
  <a href="https://wa.me/34641064192">Contacta per WhatsApp</a>
  <a href="mailto:mamosa235@gmail.com">Envia'm un correu</a>
</main>

<script>
function saveContact() {
  const vcard = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    "N:Morera Santamaria;Max;;;",
    "FN:Max Morera Santamaria",
    "TEL;TYPE=CELL:+34641064192",
    "EMAIL:mamosa235@gmail.com",
    "END:VCARD"
  ].join("\r\n") + "\r\n";

  const blob = new Blob([vcard], {type: "text/vcard;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "Max-Morera-Santamaria.vcf";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
</script>
</body>
</html>
